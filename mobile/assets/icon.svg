<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Smart Mind app icon, option F "Smart note": a green note with a folded
       top-right corner and a white sparkle, on #DCEEDD.
       The #art group (no nested groups) is reused for the Android adaptive
       foreground, monochrome and splash icons; its bounding box is
       x 302-722, y 252-772, already centered on the canvas. -->
  <rect id="background" width="1024" height="1024" fill="#DCEEDD"/>
  <g id="art">
    <!-- the note, top-right corner folded -->
    <path fill="#1F7A3A" d="M382 252 H622 L722 352 V692 A80 80 0 0 1 642 772 H382
             A80 80 0 0 1 302 692 V332 A80 80 0 0 1 382 252 Z"/>
    <path fill="#145C2A" d="M622 252 V304 A48 48 0 0 0 670 352 H722 Z"/>
    <!-- sparkle: four-point star in the middle of the note -->
    <path fill="#FFFFFF" d="M512 372 Q540 504 672 532 Q540 560 512 692
             Q484 560 352 532 Q484 504 512 372 Z"/>
  </g>
</svg>
